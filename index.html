<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="A 24-week, one-hour-a-day plan to get ready for MNC backend engineering roles.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%232b55d6'/%3E%3Cpath d='M4 9l3 3 5-7' stroke='white' stroke-width='2' fill='none'/%3E%3C/svg%3E">

</head><body>
<title>Switch Ready</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky build-bar header + tab rail; one reading column (max 1080) with grid sections that collapse to one column on phones. */
:root {
  --bg: #f4f6f9; --surface: #ffffff; --sunk: #e9edf3; --line: #d6dce6;
  --fg: #141b2b; --muted: #5a6478; --accent: #2b55d6; --accent-soft: #e2e9fd;
  --done: #17845f; --done-soft: #dcf1e8; --warn: #b26a00; --warn-soft: #fbeed6; --hard: #b8322f; --hard-soft: #fbe1e0;
  --cell0: #e3e8ef; --cell1: #b9e3cf; --cell2: #6cc59e; --cell3: #2a9c6f; --cell4: #136c4b;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f131c; --surface: #171c28; --sunk: #1e2433; --line: #2b3346;
  --fg: #e7ebf3; --muted: #98a2b8; --accent: #7d9bff; --accent-soft: #212c4d;
  --done: #4fcf98; --done-soft: #15352a; --warn: #f0b04a; --warn-soft: #3a2c12; --hard: #ff7b75; --hard-soft: #3d1c1c;
  --cell0: #232a3a; --cell1: #1b4636; --cell2: #23704f; --cell3: #33a06f; --cell4: #5fd59c; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f131c; --surface: #171c28; --sunk: #1e2433; --line: #2b3346;
  --fg: #e7ebf3; --muted: #98a2b8; --accent: #7d9bff; --accent-soft: #212c4d;
  --done: #4fcf98; --done-soft: #15352a; --warn: #f0b04a; --warn-soft: #3a2c12; --hard: #ff7b75; --hard-soft: #3d1c1c;
  --cell0: #232a3a; --cell1: #1b4636; --cell2: #23704f; --cell3: #33a06f; --cell4: #5fd59c; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font: 15px/1.6 var(--f-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface) }
a { color: var(--accent) }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; line-height: 1.2; margin: 0 }
h2 { font-size: 1.6rem; font-weight: 700 }
h3 { font-size: 1.12rem; font-weight: 700 }
p { margin: 0 }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums }
.wrap { max-width: 1080px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }

header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line) }
.bar { display: flex; align-items: center; gap: 16px; padding-block: 12px; flex-wrap: wrap }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0 }
.brand h1 { font-size: 1.3rem }
.brand .sub { color: var(--muted); font-size: .85rem }
.bar .spacer { flex: 1 }
.meter { display: flex; align-items: center; gap: 10px; font-size: .85rem; color: var(--muted) }
.meter .track { width: 140px; height: 8px; background: var(--sunk); border-radius: 4px; overflow: hidden }
.meter .fill { height: 100%; background: var(--done); transition: width .3s }
.sync { font-size: .78rem; color: var(--muted); display: flex; align-items: center; gap: 6px }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); display: inline-block }
.sync.ok i { background: var(--done) }
nav.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding-bottom: 0 }
nav.tabs::-webkit-scrollbar { display: none }
nav.tabs a { text-decoration: none; color: var(--muted); padding: 8px 12px; border-bottom: 2px solid transparent; white-space: nowrap; font-weight: 500; font-size: .92rem }
nav.tabs a:hover { color: var(--fg) }
nav.tabs a[aria-current="page"] { color: var(--fg); border-bottom-color: var(--accent) }
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px }

main { padding-block: 28px 64px; display: grid; gap: 28px }
section.view { display: grid; gap: 24px }
.lede { color: var(--muted); max-width: 68ch }
.eyebrow { font-family: var(--f-mono); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted) }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 20px }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px }
.grid2 > * { min-width: 0 }
.panel.stack { align-content: start }
.grid2 { align-items: start }
@media (max-width: 560px) { .brand .sub { display: none } }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px }
.grid3 > * { min-width: 0 }
.stack { display: grid; gap: 12px }
ul.plain { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px }
ul.dots { margin: 0; padding-left: 1.1em; display: grid; gap: 6px }

/* week heat grid */
.heat { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 6px }
.heat button { aspect-ratio: 1; border: 0; border-radius: 4px; background: var(--cell0); cursor: pointer; padding: 0; position: relative; font: 500 .66rem var(--f-mono); color: var(--muted) }
.heat button[data-l="1"] { background: var(--cell1) } .heat button[data-l="2"] { background: var(--cell2) }
.heat button[data-l="3"] { background: var(--cell3); color: var(--surface) } .heat button[data-l="4"] { background: var(--cell4); color: var(--surface) }
.heat button.now { outline: 2px solid var(--accent); outline-offset: 2px }
.heat-legend { display: flex; justify-content: space-between; gap: 8px; color: var(--muted); font-size: .78rem; flex-wrap: wrap }
@media (max-width: 560px) { .heat { grid-template-columns: repeat(8, minmax(0, 1fr)) } }

.bars { display: grid; gap: 10px }
.barrow { display: grid; grid-template-columns: 150px 1fr 48px; gap: 12px; align-items: center; font-size: .9rem }
.barrow .t { height: 8px; border-radius: 4px; background: var(--sunk); overflow: hidden }
.barrow .t span { display: block; height: 100%; background: var(--accent) }
.barrow .v { text-align: right; color: var(--muted) }
@media (max-width: 480px) { .barrow { grid-template-columns: 110px 1fr 40px } }

.chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px; font: 500 .72rem/1.7 var(--f-mono); background: var(--sunk); color: var(--muted); white-space: nowrap }
.chip.E { background: var(--done-soft); color: var(--done) } .chip.M { background: var(--warn-soft); color: var(--warn) } .chip.H { background: var(--hard-soft); color: var(--hard) }
.chip.acc { background: var(--accent-soft); color: var(--accent) }
.tagrow { display: flex; flex-wrap: wrap; gap: 6px }

/* check items */
.check { display: grid; grid-template-columns: 22px 1fr; gap: 10px; align-items: start; cursor: pointer; padding: 6px 4px; border-radius: 6px }
.check:hover { background: var(--sunk) }
.check input { appearance: none; width: 18px; height: 18px; margin: 2px 0 0; border: 1.5px solid var(--line); border-radius: 4px; background: var(--surface); display: grid; place-items: center; cursor: pointer }
.check input:checked { background: var(--done); border-color: var(--done) }
.check input:checked::after { content: ""; width: 5px; height: 9px; border: solid var(--surface); border-width: 0 2px 2px 0; transform: rotate(45deg) translate(-1px, -1px) }
.check input:checked + span { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line) }
.check span { min-width: 0 }

/* week cards */
.week { background: var(--surface); border: 1px solid var(--line); border-radius: 10px }
.week > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 56px 1fr auto; gap: 14px; align-items: center; padding: 14px 18px }
.week > summary::-webkit-details-marker { display: none }
.wk-n { font: 700 1.4rem var(--f-display); color: var(--muted) }
.week.current { border-color: var(--accent) }
.week.current .wk-n { color: var(--accent) }
.wk-meta { display: grid; gap: 2px; min-width: 0 }
.wk-meta .ph { font: 500 .7rem var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted) }
.wk-prog { font: 500 .8rem var(--f-mono); color: var(--muted); white-space: nowrap }
.wk-prog.full { color: var(--done) }
.week .body { padding: 0 18px 18px; display: grid; gap: 16px; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) }
@media (max-width: 760px) { .week .body { grid-template-columns: 1fr } }
.why { color: var(--muted); font-size: .92rem; grid-column: 1 / -1; border-left: 3px solid var(--accent-soft); padding-left: 12px }
.res a { display: grid; grid-template-columns: 62px 1fr; gap: 8px; text-decoration: none; color: var(--fg); padding: 6px 8px; border-radius: 6px; font-size: .9rem; align-items: baseline }
.res a:hover { background: var(--sunk) }
.res a b { font: 500 .66rem var(--f-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 500 }
.res a span { text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; min-width: 0 }

/* toolbar */
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center }
select, input[type="date"], input[type="search"] { font: inherit; font-size: .9rem; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--fg) }
button.btn { font: 500 .88rem var(--f-body); padding: 7px 14px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer }
button.btn:hover { background: var(--sunk) }
button.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface) }

/* dsa table */
.pattern { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden }
.pattern > header { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap }
.pattern ul { list-style: none; margin: 0; padding: 6px 10px 10px; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 2px 12px }
.prob { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: center; padding: 5px 6px; border-radius: 6px }
.prob:hover { background: var(--sunk) }
.prob a { color: var(--fg); text-decoration: none; min-width: 0; overflow-wrap: anywhere }
.prob a:hover { text-decoration: underline }
.prob.is-done a { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line) }
.prob input { appearance: none; width: 18px; height: 18px; margin: 0; border: 1.5px solid var(--line); border-radius: 4px; background: var(--surface); display: grid; place-items: center; cursor: pointer }
.prob input:checked { background: var(--done); border-color: var(--done) }
.prob input:checked::after { content: ""; width: 5px; height: 9px; border: solid var(--surface); border-width: 0 2px 2px 0; transform: rotate(45deg) translate(-1px, -1px) }

.kv { display: grid; grid-template-columns: 180px 1fr; gap: 6px 16px; font-size: .92rem }
.kv dt { color: var(--muted) }
.kv dd { margin: 0 }
@media (max-width: 560px) { .kv { grid-template-columns: 1fr } .kv dd { margin-bottom: 8px } }

.star { display: grid; gap: 8px }
.star dl { display: grid; grid-template-columns: 22px 1fr; gap: 6px 10px; margin: 0; font-size: .9rem }
.star dt { font: 700 .85rem var(--f-mono); color: var(--accent) }
.star dd { margin: 0 }
.src { font-size: .8rem; color: var(--muted) }

.fix { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 16px; padding-block: 12px; border-top: 1px solid var(--line) }
.fix:first-child { border-top: 0; padding-top: 0 }
.fix .bad { color: var(--hard); font-size: .9rem }
@media (max-width: 640px) { .fix { grid-template-columns: 1fr; gap: 4px } }
blockquote { margin: 0; padding: 10px 14px; background: var(--sunk); border-radius: 8px; font-size: .92rem }
.copy { float: right; margin-left: 8px }

.strength li::marker { color: var(--done) }
.gap li::marker { color: var(--hard) }
.day { display: grid; grid-template-columns: 110px 1fr; gap: 6px 12px; font-size: .9rem }
.day b { font-weight: 600 }
.toast { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: .85rem; opacity: 0; transition: opacity .2s; pointer-events: none }
.toast.show { opacity: 1 }
@media (prefers-reduced-motion: reduce) { * { transition: none !important } }
</style>

<header class="top">
  <div class="wrap">
    <div class="bar">
      <div class="brand"><h1>Switch Ready</h1><span class="sub">24 weeks, about an hour a day</span></div>
      <div class="spacer"></div>
      <div class="meter"><span class="mono" id="pct">0%</span><div class="track"><div class="fill" id="pctFill" style="width:0%"></div></div></div>
      <div class="sync" id="sync"><i></i><span>Saved on this device</span></div>
    </div>
    <nav class="tabs" id="tabs" aria-label="Sections">
      <a href="#overview">Overview</a><a href="#roadmap">Roadmap</a><a href="#dsa">DSA</a><a href="#design">System design</a>
      <a href="#skills">Skills</a><a href="#videos">Videos</a><a href="#certs">Certifications</a><a href="#projects">Projects</a><a href="#interview">Interview</a><a href="#resume">Resume &amp; LinkedIn</a>
    </nav>
  </div>
</header>

<main class="wrap" id="main"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
// ---------- CONTENT ----------
const R = (label, url, kind) => ({ label, url, kind });

const WEEKS = [
  { n: 1, theme: "Quick wins: resume, LinkedIn and the DSA habit", phase: "Be ready now",
    why: "If a good opening comes up next month, your profile should already be ready. These fixes take a few hours and pay off immediately.",
    tasks: [
      "Weekdays: 1 DSA problem a day from Arrays & Hashing (30 min cap; read the solution if stuck)",
      "Weekdays: Java basics refresh: String immutability, equals/hashCode, wrappers, static/final",
      "Weekend: apply the first 5 fixes in the Resume tab",
      "Weekend: update LinkedIn headline and About; set Open to Work for recruiters only",
      "Set up a GitHub repo called dsa-java and push every solution there" ],
    res: [ R("NeetCode roadmap + video solutions", "https://neetcode.io/roadmap", "video"),
      R("Striver A2Z DSA sheet", "https://takeuforward.org/strivers-a2z-dsa-course/strivers-a2z-dsa-course-sheet-2", "practice"),
      R("Tech Interview Handbook: resume", "https://www.techinterviewhandbook.org/resume/", "doc") ] },
  { n: 2, theme: "Collections and OOP", phase: "Foundations",
    why: "HashMap internals and OOP design come up in nearly every first technical round.",
    tasks: [
      "Weekdays: 1 DSA problem a day (Arrays & Hashing)",
      "Weekdays: ArrayList vs LinkedList, HashMap internals, ConcurrentHashMap",
      "Weekdays: OOP pillars and SOLID, each with your own example",
      "Weekend: finish the remaining Resume-tab fixes and Naukri profile" ],
    res: [ R("Java Brains (YouTube)", "https://www.youtube.com/@Java.Brains", "video"),
      R("Baeldung: Java Collections", "https://www.baeldung.com/java-collections", "doc"),
      R("roadmap.sh: Java", "https://roadmap.sh/java", "doc") ] },
  { n: 3, theme: "Streams, exceptions and SQL", phase: "Foundations",
    why: "SQL is tested in most backend loops, and banks especially like window-function questions.",
    tasks: [
      "Weekdays: 1 DSA problem a day (finish Arrays & Hashing, start Two Pointers)",
      "Weekdays: Streams, lambdas, Optional; checked vs unchecked exceptions",
      "Weekend: SQL joins, GROUP BY/HAVING, window functions; 8 problems from LeetCode SQL 50" ],
    res: [ R("LeetCode Top SQL 50", "https://leetcode.com/studyplan/top-sql-50/", "practice"),
      R("techTFQ: SQL window functions", "https://www.youtube.com/results?search_query=techTFQ+SQL+window+functions", "video"),
      R("SQLBolt", "https://sqlbolt.com/", "practice") ] },
  { n: 4, theme: "Concurrency and the JVM", phase: "Foundations",
    why: "Threads and JVM memory questions separate 2-year candidates from freshers.",
    tasks: [
      "Weekdays: 1 DSA problem a day (Two Pointers, then Sliding Window)",
      "Weekdays: threads, ExecutorService, CompletableFuture, synchronized vs Lock, volatile",
      "Weekend: JVM memory, GC basics; indexes and EXPLAIN in SQL; 7 more SQL 50 problems" ],
    res: [ R("Jenkov: Java Concurrency", "https://jenkov.com/tutorials/java-concurrency/index.html", "doc"),
      R("Defog Tech (YouTube)", "https://www.youtube.com/@DefogTech", "video"),
      R("Use The Index, Luke", "https://use-the-index-luke.com/", "doc") ] },
  { n: 5, theme: "Spring Boot fundamentals", phase: "Spring backend",
    why: "This is the job itself. Interviewers will probe how Spring works, not just that you've used it.",
    tasks: [
      "Weekdays: 1 DSA problem a day (Sliding Window, then Stack)",
      "Weekdays: IoC/DI, bean scopes and lifecycle, profiles, auto-configuration",
      "Weekend: build a small CRUD API with validation and @ControllerAdvice error handling" ],
    res: [ R("Spring Boot reference", "https://docs.spring.io/spring-boot/index.html", "doc"),
      R("Amigoscode: Spring Boot full course", "https://www.youtube.com/results?search_query=Amigoscode+Spring+Boot+full+course", "video"),
      R("Spring guides", "https://spring.io/guides", "doc") ] },
  { n: 6, theme: "JPA, Hibernate and transactions", phase: "Spring backend",
    why: "N+1 queries and @Transactional behaviour are classic interview questions and real production bugs.",
    tasks: [
      "Weekdays: 1 DSA problem a day (Stack, then Binary Search)",
      "Weekdays: entities, relationships, fetch types, the N+1 problem",
      "Weekdays: @Transactional propagation, isolation, why self-invocation skips it",
      "Weekend: Relay: create the repo, README problem statement, architecture sketch" ],
    res: [ R("Vlad Mihalcea (JPA performance)", "https://vladmihalcea.com/tutorials/hibernate/", "doc"),
      R("Spring Data JPA docs", "https://docs.spring.io/spring-data/jpa/reference/", "doc") ] },
  { n: 7, theme: "PostgreSQL and the first Relay endpoint", phase: "Spring backend",
    why: "A second database and a real project repo both show up on your resume from here.",
    tasks: [
      "Weekdays: 1 DSA problem a day (Binary Search, then Linked List)",
      "Weekdays: PostgreSQL basics vs MySQL, Flyway migrations",
      "Weekend: Relay: POST /notifications with validation, PostgreSQL schema, status lifecycle" ],
    res: [ R("PostgreSQL tutorial", "https://www.postgresqltutorial.com/", "doc"),
      R("Flyway docs", "https://documentation.red-gate.com/flyway", "doc") ] },
  { n: 8, theme: "Testing", phase: "Spring backend",
    why: "Tests are the first thing a reviewer checks in your GitHub. No tests reads as junior.",
    tasks: [
      "Weekdays: 1 DSA problem a day (Linked List)",
      "Weekdays: JUnit 5 + Mockito for the service layer",
      "Weekend: integration tests with MockMvc and Testcontainers for Relay" ],
    res: [ R("JUnit 5 user guide", "https://junit.org/junit5/docs/current/user-guide/", "doc"),
      R("Testcontainers", "https://testcontainers.com/", "doc"),
      R("Mockito", "https://site.mockito.org/", "doc") ] },
  { n: 9, theme: "Spring Security and JWT", phase: "Spring backend",
    why: "Auth questions appear in every backend loop, and your Velox security work makes this a natural story.",
    tasks: [
      "Weekdays: 1 DSA problem a day (start Trees)",
      "Weekdays: security filter chain, stateless JWT, roles; OAuth2 concepts",
      "Weekend: add JWT auth and per-tenant API keys to Relay" ],
    res: [ R("Spring Security reference", "https://docs.spring.io/spring-security/reference/", "doc"),
      R("Dan Vega: Spring Security JWT", "https://www.youtube.com/results?search_query=Dan+Vega+Spring+Security+JWT", "video") ] },
  { n: 10, theme: "Docker", phase: "DevOps",
    why: "Docker is a baseline expectation, and it lets any reviewer run your project with one command.",
    tasks: [
      "Weekdays: 1 DSA problem a day (Trees)",
      "Weekdays: images vs containers, layers, multi-stage builds",
      "Weekend: Docker Compose for Relay + PostgreSQL; `docker compose up` starts everything" ],
    res: [ R("TechWorld with Nana: Docker", "https://www.youtube.com/results?search_query=TechWorld+with+Nana+Docker+tutorial+for+beginners", "video"),
      R("Docker: Get started", "https://docs.docker.com/get-started/", "doc") ] },
  { n: 11, theme: "Redis and caching", phase: "Backend depth",
    why: "Caching is the most-used building block in system design rounds.",
    tasks: [
      "Weekdays: 1 DSA problem a day (finish Trees, Tries)",
      "Weekdays: Redis data types, TTL, cache-aside, eviction",
      "Weekend: per-tenant rate limiting in Relay with a Redis token bucket" ],
    res: [ R("Redis University (free)", "https://university.redis.io/", "video"),
      R("Redis docs", "https://redis.io/docs/latest/", "doc") ] },
  { n: 12, theme: "Kafka", phase: "Backend depth",
    why: "Event streaming fits your SMPP/RCS background and is a strong differentiator.",
    tasks: [
      "Weekdays: 1 DSA problem a day (Heap / Priority Queue)",
      "Weekdays: topics, partitions, consumer groups, ordering, DLQ",
      "Weekend: Relay publishes events to Kafka; one channel worker consumes them" ],

// ---------- STATE ----------
const LS_KEY = "switch-ready-v1";
let state = { done: {}, start: null };
let docRef = null, writing = Promise.resolve(), saveT = null;
try { const raw = localStorage.getItem(LS_KEY); if (raw) state = Object.assign(state, JSON.parse(raw)); } catch (e) {}

function persist() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {}
  if (!docRef) return;
  clearTimeout(saveT);
  saveT = setTimeout(() => {
    const snapshot = { done: state.done, start: state.start || null, updatedAt: new Date().toISOString() };
    writing = writing.then(() => docRef.set(snapshot)).then(() => setSync(true, "Synced to your account"))
      .catch(() => setSync(false, "Couldn't sync. Saved on this device"));
  }, 700);
}
function setSync(ok, text) { const el = document.getElementById("sync"); el.classList.toggle("ok", ok); el.querySelector("span").textContent = text; }

async function connectStore() {
  if (!window.claude || !window.claude.use) return;
  try {
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) return;
    const id = await user.id();
    if (!id) return;
    docRef = db.collection("data/users/" + id).doc("progress");
    const snap = await docRef.get();
    if (snap.exists) {
      const d = snap.data() || {};
      state.done = Object.assign({}, state.done, d.done || {});
      if (d.start && !state.start) state.start = d.start;
      try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {}
      render();
    }
    setSync(true, "Synced to your account");
    if (!snap.exists && Object.keys(state.done).length) persist();
  } catch (e) { setSync(false, "Saved on this device"); }
}

function toggle(id, on) {
  if (on) state.done[id] = 1; else delete state.done[id];
  persist(); updateMeters();
}

    return `<div class="pattern"><header><h3>${esc(p.pat)}</h3><span class="tagrow"><span class="chip">${DSA_WHEN[p.pat]}</span><span class="chip acc mono">${c}/${p.items.length}</span></span></header>
      <ul>${items.map(i => `<li class="prob ${state.done[i.id] ? "is-done" : ""}"><input type="checkbox" data-id="${i.id}" aria-label="Mark ${esc(i.title)} solved" ${state.done[i.id] ? "checked" : ""}><a href="https://leetcode.com/problems/${i.slug}/" target="_blank" rel="noopener">${esc(i.title)}</a><span class="chip ${i.d}">${{ E: "Easy", M: "Med", H: "Hard" }[i.d]}</span></li>`).join("")}</ul></div>`; }).join("");
  const by = d => DSA_LIST.flatMap(p => p.items).filter(i => i.d === d);
  return `<div class="stack"><span class="eyebrow">DSA</span><h2>${total} problems, grouped by pattern</h2>
    <p class="lede">Learn the pattern first (watch the NeetCode or Striver explanation), then solve without looking. If you're stuck for 25 minutes, read the solution, then redo the problem from scratch two days later. Solve in Java.</p>
    <div class="tagrow"><span class="chip E">Easy ${count(by("E").map(i => i.id))}/${by("E").length}</span><span class="chip M">Medium ${count(by("M").map(i => i.id))}/${by("M").length}</span><span class="chip H">Hard ${count(by("H").map(i => i.id))}/${by("H").length}</span></div>
    <div class="toolbar">
      <select id="fPat" aria-label="Pattern"><option value="all">All patterns</option>${opts}</select>
      <select id="fDiff" aria-label="Difficulty"><option value="all">All levels</option><option value="E" ${dsaFilter.diff === "E" ? "selected" : ""}>Easy</option><option value="M" ${dsaFilter.diff === "M" ? "selected" : ""}>Medium</option><option value="H" ${dsaFilter.diff === "H" ? "selected" : ""}>Hard</option></select>
      <select id="fStatus" aria-label="Status"><option value="all">All</option><option value="todo" ${dsaFilter.status === "todo" ? "selected" : ""}>To do</option><option value="done" ${dsaFilter.status === "done" ? "selected" : ""}>Solved</option></select>
    </div></div>
  <div class="stack">${blocks || '<div class="panel"><p class="lede">Nothing matches these filters.</p></div>'}</div>
  <div class="panel res"><h3 style="margin-bottom:8px">Where to learn the patterns</h3>
    ${[R("NeetCode roadmap + videos", "https://neetcode.io/roadmap", "video"), R("Striver A2Z DSA sheet", "https://takeuforward.org/strivers-a2z-dsa-course/strivers-a2z-dsa-course-sheet-2", "video"), R("take U forward (YouTube)", "https://www.youtube.com/@takeUforward", "video"), R("LeetCode Top Interview 150", "https://leetcode.com/studyplan/top-interview-150/", "practice"), R("Big-O cheat sheet", "https://www.bigocheatsheet.com/", "doc")].map(resLink).join("")}</div>`;
};

  <div class="panel stack"><h3>Java & Spring question bank</h3><p class="lede" style="font-size:.9rem">Tick only when you can answer out loud in 2 minutes with an example.</p>

  </div>`;

V.certs = () => { const tiers = ["Do first", "Strong add-on", "Situational", "Free"];

  <p class="lede">Certifications help you get shortlisted, but projects and interviews get you the offer. With an hour a day, do just one: AWS SAA, studied in weeks 15–24. Add another only after you've switched, or if a target company asks for it. Prices are approximate; check the official page before booking.</p></div>

    ${VELOX_BULLETS.map((b, i) => `<blockquote id="vb${i}"><button class="btn copy" data-copy="vb${i}">Copy</button>${esc(b)}</blockquote>`).join("")}</div>

// ---------- RENDER / ROUTER ----------
const ROUTES = Object.keys(V);
function route() { const h = location.hash.slice(1); return ROUTES.includes(h) ? h : "overview"; }
function render() {
  const r = route();
  document.getElementById("main").innerHTML = `<section class="view">${V[r]()}</section>`;
  document.querySelectorAll("#tabs a").forEach(a => { if (a.getAttribute("href") === "#" + r) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  updateMeters();
}
function updateMeters() {
  const all = Object.values(ALL).flat();
  const p = pct(all);
  document.getElementById("pct").textContent = p + "%";
  document.getElementById("pctFill").style.width = p + "%";
}
let pendingOpen = null;
window.addEventListener("hashchange", () => { render(); window.scrollTo(0, 0); if (pendingOpen) { const d = document.getElementById("week-" + pendingOpen); if (d) { d.open = true; d.scrollIntoView({ block: "start" }); } pendingOpen = null; } });

document.addEventListener("change", e => {
  const t = e.target;
  if (t.matches("input[type=checkbox][data-id]")) {
    toggle(t.dataset.id, t.checked);
    const li = t.closest(".prob"); if (li) li.classList.toggle("is-done", t.checked);
    const r = route();
    if (r === "overview" || r === "dsa" && dsaFilter.status !== "all") render();
    else refreshCounts();
  }
  if (t.id === "startDate") { state.start = t.value || null; persist(); render(); toast(t.value ? "Start date saved" : "Start date cleared"); }
  if (t.id === "fPat") { dsaFilter.pat = t.value; render(); }
  if (t.id === "fDiff") { dsaFilter.diff = t.value; render(); }
  if (t.id === "fStatus") { dsaFilter.status = t.value; render(); }
});
function refreshCounts() {
  // Light re-render of counters without losing open <details> state.
  const r = route();
  if (r === "roadmap") WEEKS.forEach(w => { const el = document.querySelector(`[data-wk="${w.n}"]`); if (el) { const ids = weekIds(w); const c = count(ids); el.textContent = `${c}/${ids.length}`; el.classList.toggle("full", c === ids.length); } });
  else { const y = window.scrollY; render(); window.scrollTo(0, y); }
}
document.addEventListener("click", e => {
  const t = e.target.closest("button, a");
  if (!t) return;
  if (t.dataset.week) { pendingOpen = t.dataset.week; if (location.hash === "#roadmap") window.dispatchEvent(new HashChangeEvent("hashchange")); else location.hash = "roadmap"; }
  if (t.dataset.open) { pendingOpen = t.dataset.open; }
  if (t.id === "exportBtn") { const code = btoa(unescape(encodeURIComponent(JSON.stringify(state)))); try { navigator.clipboard.writeText(code).then(() => toast("Progress code copied"), () => { const i = document.getElementById("importCode"); i.value = code; i.select(); toast("Code selected. Press Ctrl+C"); }); } catch (err) {} }
  if (t.id === "importBtn") { try { const d = JSON.parse(decodeURIComponent(escape(atob(document.getElementById("importCode").value.trim())))); state.done = Object.assign({}, state.done, d.done || {}); if (d.start) state.start = d.start; persist(); render(); toast("Progress loaded"); } catch (err) { toast("That code didn't work. Copy it again and retry"); } }
  if (t.id === "expandAll") document.querySelectorAll("details.week").forEach(d => d.open = true);
  if (t.id === "collapseAll") document.querySelectorAll("details.week").forEach(d => d.open = false);
  if (t.dataset.copy) {
    const el = document.getElementById(t.dataset.copy); const text = [...el.childNodes].filter(n => n.nodeType === 3).map(n => n.textContent).join("").trim();
    try { navigator.clipboard.writeText(text).then(() => toast("Copied"), () => selectText(el)); } catch (err) { selectText(el); }
  }
});
function selectText(el) { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("Selected. Press Ctrl+C to copy"); }

render();
connectStore();
</script>
